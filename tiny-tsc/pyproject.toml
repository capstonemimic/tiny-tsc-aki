[project]
name = "tiny-tsc"
version = "0.1.0"
description = "24-hour AKI classification and causal-history comparisons"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==2.3.5",
    "pandas==3.0.0",
    "pyarrow==23.0.0",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "safetensors==0.7.0",
    "pyyaml==6.0.3",
    "tsai==0.4.1",
    "fastai==2.8.6",
    "fastcore==1.12.11",
    "fastprogress==1.1.3",
    "plum-dispatch==2.6.1",
    "lightning==2.6.0",
    "torchcde==0.2.5",
    "tensorboard==2.20.0",
    "google-crc32c==1.7.0",
    "ipykernel==7.2.0",
    "ipython==9.10.0",
    "dacite==1.9.2",
    "typer==0.27.2",
    "matplotlib==3.11.1",
    "torchmetrics==1.9.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
